[package]
name = "skyainet-api"
version = "0.6.7"
edition = "2021"
authors = ["SkyAInet Team"]
description = "SkyAInet API Layer — REST + GraphQL + WebSocket"
license = "AGPL-3.0"
repository = "https://github.com/InventionEx5/skyainet-rs"
keywords = ["api", "graphql", "websocket", "decentralized", "ai"]
categories = ["network-programming", "web-programming"]

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws"] }
async-graphql = "7.0"
async-graphql-axum = "7.0"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Internal Crates
skyainet-model = { path = "../model" }
skyainet-node = { path = "../node" }
skyainet-core = { path = "../core" }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
full = ["async-graphql/apollo-tracing"]