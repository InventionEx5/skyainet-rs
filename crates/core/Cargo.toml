[package]
name = "skyainet-core"
version = "0.4.2"
edition = "2021"
authors = ["SkyAInet Team"]
description = "SkyAInet Core — Shared types, economics, rewards, node types and ethical alignment"
license = "AGPL-3.0"
repository = "https://github.com/InventionEx5/skyainet-rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & Date
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
rand = "0.8"

[features]
default = []
full = []           # Active toutes les fonctionnalités (si besoin plus tard)