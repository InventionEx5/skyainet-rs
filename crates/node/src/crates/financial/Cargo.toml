[package]
name = "skyainet-financial"
version = "0.4.2"
edition = "2021"
authors = ["SkyAInet Team"]
description = "SkyAInet Financial — Treasury, Liquidity Management & On-Chain Operations"
license = "AGPL-3.0"
repository = "https://github.com/InventionEx5/skyainet-rs"

[dependencies]
# Async & Runtime
tokio = { version = "1.38", features = ["full"] }

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Time & Date
chrono = { version = "0.4", features = ["serde"] }

# Alloy (Ethereum / Blockchain)
alloy = { version = "0.1", features = ["full", "rpc-types", "provider-http", "provider-ws", "signer-local"] }

# Internal dependencies (workspace)
skyainet-core = { path = "../core" }
skyainet-node = { path = "../node" }
secure-transport = { path = "../secure-transport" }

[dev-dependencies]
rand = "0.8"

[features]
default = []
full-financial = []      # Active Treasury + Liquidity + toutes les fonctionnalités on-chain
treasury-only = []       # Mode léger (seulement Treasury)
liquidity-only = []      # Mode Liquidity uniquement