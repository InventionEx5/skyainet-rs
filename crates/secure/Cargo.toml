[package]
name = "secure"
version = "0.6.1"
edition = "2021"
authors = ["SkyAInet × Nikola T369"]
description = "SkyAInet Secure Transport — Post-Quantum + RomanT369 + DID + Group Messaging"
license = "MIT"
repository = "https://github.com/skyainet/secure"

[dependencies]
# === Cryptographie de base ===
sha2 = "0.10"
hkdf = "0.12"
blake3 = "1.5"
aes-gcm = "0.10"
zstd = "0.13"

# === Génération aléatoire ===
rand = "0.8"
rand_core = "0.6"

# === Post-Quantique & Dilithium ===
# (Assure-toi d’avoir le crate dilithium dans le workspace ou en dépendance locale)
dilithium = { path = "../dilithium" }   # ← À adapter selon ton organisation

# === Réseau & Async ===
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
libp2p = { version = "0.53", features = [
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "kad",
    "mdns",
    "tokio"
] }

# === Sérialisation & Logs ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

# === Utilitaires supplémentaires ===
ed25519-dalek = "2.1"   # (encore utilisé dans quelques parties legacy)

[dev-dependencies]
tokio-test = "0.4"