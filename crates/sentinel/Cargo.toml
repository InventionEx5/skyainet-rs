[package]
name = "skyainet-sentinel"
version = "0.4.2"
edition = "2021"
authors = ["SkyAInet Team"]
description = "SkyAInet Sentinel — Auto-Healing, Anti-Fork, Node Identity & Defense System"
license = "AGPL-3.0"
repository = "https://github.com/InventionEx5/skyainet-rs"

[dependencies]
# Async & Runtime
tokio = { version = "1.38", features = ["full"] }

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & Date
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.8", features = ["v4"] }

# Random
rand = "0.8"

# Internal dependencies (workspace)
skyainet-core = { path = "../core" }
skyainet-node = { path = "../node" }
secure-transport = { path = "../secure-transport" }

[dev-dependencies]
rand = "0.8"

[features]
default = []
full-defense = []      # Active toutes les fonctionnalités de défense avancées (crypto, healing, etc.)
light-mode = []        # Mode léger (sans crypto lourd, pour tests rapides)